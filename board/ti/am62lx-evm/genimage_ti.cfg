image boot.vfat {
	vfat {
		files = {
			"tiboot3.bin",
			"tispl.bin",
			"u-boot.img",
			"uEnv.txt"
		}
	}

	size = 64M
}

image data.ext4 {
	ext4 {}
	size = 128M
}

image tisdk-buildroot-sdcard-image.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition u-boot {
		partition-type-uuid = U
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs.a {
		partition-type-uuid = L
		partition-uuid = "b8b7a26e-0001-4b9e-8001-aabbccddeeff"
		image = "rootfs.ext4"
	}

	partition rootfs.b {
		partition-type-uuid = L
		partition-uuid = "b8b7a26e-0002-4b9e-8002-aabbccddeeff"
		image = "rootfs.ext4"
	}

	partition data {
		partition-type-uuid = L
		image = "data.ext4"
	}

}
